name: Build and publish docs

on:
  push:
    branches: ['main']

  workflow_dispatch:

  workflow_run:
    workflows: ['Promote API documentation versions']
    types: [completed]

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0
          ref: main
          persist-credentials: false

      - name: Record current main revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install Doxygen
        run: sudo apt-get install doxygen

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Build docs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/generate_versioned_api_docs.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'api-docs/_build/versioned/'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Reject stale artifacts
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          BUILT_SHA: ${{ needs.build.outputs.revision }}
          REPOSITORY: ${{ github.repository }}
        run: |
          current=$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ "$current" == "$BUILT_SHA" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping stale artifact $BUILT_SHA; main is $current."
          fi

      - name: Setup Pages
        if: steps.current.outputs.deploy == 'true'
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        if: steps.current.outputs.deploy == 'true'
        id: deployment
        uses: actions/deploy-pages@v4