name: Build and publish docs

on:
  release:
    types: [published]

  push:
    branches: ['main']

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'github-pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install Doxygen
        run: sudo apt-get install doxygen

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Build docs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/generate_versioned_api_docs.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'api-docs/_build/versioned/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4