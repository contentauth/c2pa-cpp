name: CI

on:

  workflow_dispatch:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - unlabeled
  push:
    branches:
      - main

jobs:
  docs-config:
    name: Documentation version configuration
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted validator
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted
          persist-credentials: false
          sparse-checkout: scripts/generate_versioned_api_docs.py
          sparse-checkout-cone-mode: false
      - name: Checkout candidate configuration
        uses: actions/checkout@v4
        with:
          path: candidate
          persist-credentials: false
          sparse-checkout: api-docs/versions.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Validate candidate configuration with trusted code
        working-directory: trusted
        run: |
          python3 -I - <<'PY'
          import importlib.util
          from pathlib import Path

          spec = importlib.util.spec_from_file_location(
              "docs", "scripts/generate_versioned_api_docs.py"
          )
          docs = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(docs)
          docs.load_versions(Path("../candidate/api-docs/versions.json"))
          PY

  docs:
    name: Versioned API documentation
    permissions:
      contents: read
    if: |
      github.event_name != 'pull_request' ||
      github.event.pull_request.author_association == 'COLLABORATOR' ||
      github.event.pull_request.author_association == 'MEMBER' ||
      github.event.pull_request.user.login == 'dependabot[bot]' ||
      contains(github.event.pull_request.labels.*.name, 'safe to test')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Doxygen
        run: sudo apt-get install doxygen
      - name: Test documentation tooling
        run: |
          python3 -m unittest discover -s tests -p 'test_versioned_docs.py'
          node --test tests/test_version_selector.js
      - name: Build versioned documentation
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/generate_versioned_api_docs.py
      - name: Upload documentation preview
        uses: actions/upload-artifact@v4
        with:
          name: versioned-api-documentation
          path: api-docs/_build/versioned/
          if-no-files-found: error

  docs-required:
    name: Documentation checks
    needs: [docs-config, docs]
    if: always()
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Require successful validation and build
        env:
          CONFIG_RESULT: ${{ needs.docs-config.result }}
          BUILD_RESULT: ${{ needs.docs.result }}
        run: |
          if [ "$CONFIG_RESULT" != success ] || [ "$BUILD_RESULT" != success ]; then
            echo "::error::Documentation checks did not succeed (configuration: $CONFIG_RESULT, build: $BUILD_RESULT). A maintainer must authorize gated builds with the 'safe to test' label."
            exit 1
          fi

  tests:
    name: Unit tests

    if: |
      github.event_name != 'pull_request' ||
      github.event.pull_request.author_association == 'COLLABORATOR' ||
      github.event.pull_request.author_association == 'MEMBER' ||
      github.event.pull_request.user.login == 'dependabot[bot]' ||
      contains(github.event.pull_request.labels.*.name, 'safe to test')

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm, macos-latest, macos-15-intel, ubuntu-latest, ubuntu-22.04, ubuntu-22.04-arm, ubuntu-24.04-arm]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check cmake
        run: cmake --version

      - name: Check Ninja
        run: ninja --version

      - name: Setup MSVC toolchain on Windows
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}

      - name: Print make version and path
        run: |
          which make
          make --version

      - name: Build and test against c2pa-rs 0.92.0 release
        run: make test

      - name: Run tests (debug build, with sanitizers)
        if: runner.os != 'Windows'
        run: make test-san
