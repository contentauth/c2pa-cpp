name: CI

on:

  workflow_dispatch:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
  push:
    branches:
      - main

jobs:
  tests:
    name: Unit tests

    if: |
      github.event_name != 'pull_request' ||
      github.event.pull_request.author_association == 'COLLABORATOR' ||
      github.event.pull_request.author_association == 'MEMBER' ||
      github.event.pull_request.user.login == 'dependabot[bot]' ||
      contains(github.event.pull_request.labels.*.name, 'safe to test')

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm, macos-latest, macos-15-intel, ubuntu-latest, ubuntu-22.04, ubuntu-22.04-arm, ubuntu-24.04-arm]

    # TEMPORARY: exercise the c2pa-rs 0.91.0-rc.1 release candidate before it
    # ships as a release, to surface breaking issues early. Prebuilt binaries
    # for this RC are published under the "c2pa-rc-v0.91.0-rc.1" tag rather
    # than the usual "c2pa-v<version>" tag, so override C2PA_VERSION and
    # C2PA_PREBUILT_TAG (see CMakeLists.txt / src/CMakeLists.txt) to fetch them.
    # Revert this env block once the RC ships as a release and C2PA_VERSION in
    # CMakeLists.txt can be bumped normally.
    env:
      C2PA_VERSION: "0.91.0-rc.1"
      C2PA_PREBUILT_TAG: "c2pa-rc-v0.91.0-rc.1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check cmake
        run: cmake --version

      - name: Check Ninja
        run: ninja --version

      - name: Configure
        run: cmake -S . -B build -G Ninja

      - name: Setup MSVC toolchain on Windows
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Print make version and path
        run: |
          which make
          make --version

      - name: Run tests (debug build)
        run: make test

      - name: Run tests (debug build, with sanitizers)
        if: runner.os != 'Windows'
        run: make test-san
